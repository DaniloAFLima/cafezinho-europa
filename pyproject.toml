[project]
name = "cafezinho-europa"
version = "0.1.0"
description = "Pipeline de notícias automatizadas para brasileiros na Europa"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
